name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # ⚠️ Если ваша основная ветка называется 'master', замените 'main' на 'master'
  workflow_dispatch:   # Позволяет запустить сборку вручную из вкладки Actions

# Разрешения, необходимые для деплоя на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Отменяем предыдущие запуски, если сделан новый push, чтобы не тратить ресурсы
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Используем ту же современную версию, что и у вас локально

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci # 'ci' быстрее и надежнее 'install' для CI/CD

      - name: Build with Astro
        run: npm run build # Выполнит ваш скрипт: "node copy-gp5.mjs && astro build"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Astro по умолчанию собирает проект в папку 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4